[package]
name = "krewlyzer_core"
version = "0.9.2"
edition = "2021"
rust-version = "1.87"  # Required for u64::is_multiple_of (stabilized 1.87)
authors = ["Ronak Shah <shahr2@mskcc.org>"]
description = "High-performance Rust backend for krewlyzer cfDNA analysis"
repository = "https://github.com/msk-access/krewlyzer"
license = "AGPL-3.0"

[lib]
name = "krewlyzer_core"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

# noodles for BED/BGZF/Tabix
noodles = { version = "0.103", features = ["bed", "tabix", "bgzf", "core"] }

# rust-htslib for BAM operations.
#
# This crate forces bindgen on: it declares `hts-sys` with
# `features = ["bindgen"], default-features = false`, so hts-sys' prebuilt
# bindings are never used and every build parses htslib's C headers with
# whatever libclang is on the machine. That makes the build sensitive to the
# host toolchain, and the sensitivity is one-directional -- a libclang newer
# than the pinned bindgen knows about yields *opaque* structs rather than an
# error, so the failure surfaces as missing fields in rust-htslib's own source:
#
#     error[E0609]: no field `n_targets` on type `sam_hdr_t`
#       = note: available field is: `_address`
#
# If you see that, the bindgen in rust/Cargo.lock is older than your libclang.
# The fix is `cargo update -p hts-sys` (hts-sys 2.2.1 moved bindgen 0.69 -> 0.72
# for libclang 21), not a code change. Keep the lock committed: it is the only
# thing recording which bindgen this builds with.
rust-htslib = "0.51"

# Parallelism
rayon = "1.10"
num_cpus = "1.16"

# Additional dependencies
bstr = "1.10"
thiserror = "2.0"
anyhow = "1.0"
flate2 = "1.0"
log = "0.4"
pyo3-log = "0.12"
indicatif = "0.17"

# Numerical
ndarray = "0.16"
numpy = "0.23"

# Interval Trees
coitrees = "0.4"

# LOESS/LOWESS for GC bias correction
lowess = "0.4.1"

# Savitzky-Golay smoothing for WPS profiles
sci-rs = "0.4.1"

# FFT for periodicity extraction (replaces scipy.fft)
realfft = "3.5"

# JSON parsing for PON models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parquet for PON model storage
parquet = { version = "53.0", features = ["arrow"] }
arrow = "53.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[dev-dependencies]
# Required by the #[cfg(test)] modules in src/output_utils.rs
tempfile = "3"
