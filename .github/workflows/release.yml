name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI Trusted Publisher OIDC
      contents: write  # Required to create the GitHub Release
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        lfs: true  # Required for data files in src/krewlyzer/data/

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        sudo apt-get update && sudo apt-get install -y clang libclang-dev
        pip install uv

    - name: Build package
      run: |
        uv venv .venv
        . .venv/bin/activate
        uv pip install .

    - name: Run tests
      run: |
        . .venv/bin/activate
        uv pip install .[test]
        uv pip list
        python -m pytest

    - name: Build distribution
      uses: PyO3/maturin-action@v1
      with:
        command: build
        args: --release --out dist --sdist --manifest-path rust/Cargo.toml -i python3.10 python3.11 python3.12
        manylinux: manylinux_2_28
        before-script-linux: |
          # Use system OpenSSL instead of building from source
          export OPENSSL_NO_VENDOR=1
          
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
            SUDO="sudo"
          fi
          
          if command -v yum &> /dev/null; then
            $SUDO yum install -y zlib-devel bzip2-devel xz-devel libcurl-devel openssl-devel clang llvm-devel
          elif command -v apt-get &> /dev/null; then
            $SUDO apt-get update && $SUDO apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev clang libclang-dev
          elif command -v apk &> /dev/null; then
            $SUDO apk add zlib-dev bzip2-dev xz-dev curl-dev openssl-dev clang clang-dev
          else
            echo "Unsupported package manager"
            exit 1
          fi
        
    - name: Verify Wheel
      run: |
        . .venv/bin/activate
        pip install dist/*cp310*.whl
        python -c "import krewlyzer; print('Imported:', krewlyzer); print('File:', krewlyzer.__file__)"
        krewlyzer --help

    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        skip-existing: true
        verbose: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/msk-access/krewlyzer:${{ github.ref_name }},ghcr.io/msk-access/krewlyzer:latest
        platforms: linux/amd64
        annotations: |
          org.opencontainers.image.title=krewlyzer
          org.opencontainers.image.description=A comprehensive toolkit for ctDNA fragmentomics analysis from GRCh37 aligned BAM files

    # -----------------------------------------------------------------------
    # Create the GitHub Release.
    #
    # Until 0.9.0 this workflow published to PyPI and GHCR and stopped, so the
    # Releases page was maintained by hand -- which meant a tag could go fully
    # green and leave nothing there at all. That is what happened for 0.9.0.
    #
    # Notes come from the CHANGELOG section for this tag rather than generated
    # commit titles: the section is written deliberately and is what a reader
    # should see. Last so it only appears once PyPI and the container are up,
    # and a Release without artefacts is never published.
    # -----------------------------------------------------------------------
    - name: Extract the CHANGELOG section for this tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        python - <<'PY' > release-notes.md
        import os, re, sys
        tag = os.environ["GITHUB_REF_NAME"]
        text = open("CHANGELOG.md", encoding="utf-8").read()
        # Headings look like "## [0.9.0] - 2026-08-11"; take up to the next "## [".
        start = re.search(rf"^## \[{re.escape(tag)}\].*$", text, re.M)
        if not start:
            sys.exit(f"no CHANGELOG section for {tag} -- add one before tagging")
        rest = text[start.end():]
        nxt = re.search(r"^## \[", rest, re.M)
        body = (rest[:nxt.start()] if nxt else rest).strip()
        if not body:
            sys.exit(f"the CHANGELOG section for {tag} is empty")

        # GitHub rejects a body over 125,000 characters. 0.9.0's section was
        # 103,376 -- inside the limit but only by 17%, so the next big release
        # would fail at the last step of a run that had already published to
        # PyPI. Cut at a heading boundary so the notes never end mid-sentence.
        LIMIT = 60_000
        if len(body) > LIMIT:
            cut = body.rfind("\n### ", 0, LIMIT)
            if cut == -1:
                cut = body.rfind("\n\n", 0, LIMIT)
            body = body[: cut if cut != -1 else LIMIT].rstrip()
            body += (
                f"\n\n---\n\nNotes truncated. Read the full {tag} entry in "
                f"[CHANGELOG.md](https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                f"/blob/{tag}/CHANGELOG.md)."
            )
        print(body)
        PY
        echo "--- notes: $(wc -c < release-notes.md) chars ---"

    - name: Create the GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        body_path: release-notes.md
        make_latest: true
          org.opencontainers.image.url=https://github.com/msk-access/krewlyzer
          org.opencontainers.image.source=https://github.com/msk-access/krewlyzer
          org.opencontainers.image.vendor=MSK-ACCESS
          org.opencontainers.image.licenses=AGPL-3.0
          org.opencontainers.image.version=${{ github.ref_name }}
