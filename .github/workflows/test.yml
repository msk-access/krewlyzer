name: Run Unit Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # `lfs: false` here and pull explicitly below, so the objects can be
          # cached. checkout's own LFS fetch happens before any cache step can
          # run, so it re-downloads 643 MB on every single run -- which is how
          # the download quota was exhausted in the first place.
          lfs: false

      # Seed once, then never spend bandwidth again.
      #
      # The key is the list of object IDs, so it changes only when the data
      # changes. `git lfs ls-files -l` reads the pointer files, so it works
      # before anything is hydrated. On a hit, `git lfs pull` finds every
      # object already in .git/lfs/objects and does no network I/O at all.
      #
      # restore-keys makes a data change incremental rather than a full
      # re-download: a stale cache still supplies the unchanged objects and
      # `git lfs pull` fetches only what is new.
      #
      # This does NOT fix a quota that is already exhausted -- the seeding run
      # still has to download. It is what stops the next month repeating it.
      - name: List the LFS object IDs
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-object-ids

      - name: Cache the LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-object-ids') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Pull the LFS objects
        id: lfs_pull
        continue-on-error: true
        run: git lfs pull

      # The budget can be spent, and on 2026-08-17 it was:
      #
      #     batch response: This repository exceeded its LFS budget.
      #
      # That is an org billing setting, not something the repository can fix,
      # and it takes every job down with it. But the release image already
      # carries this exact data -- Dockerfile:53 copies src/krewlyzer/data into
      # site-packages -- and a GHCR pull of a public package does not touch the
      # LFS budget at all.
      #
      # The obvious objection is staleness: the image is built at release time,
      # so a branch that changed the data would be tested against the old copy
      # and pass. That is not a risk here, because it is not a judgement call.
      # An LFS pointer records the sha256 of the object it stands for, so the
      # verify step below compares the recovered bytes against what git says
      # they must be. Either every hash matches -- in which case the data is
      # provably what LFS would have handed over -- or the build fails.
      - name: Recover the data from the release image if LFS is unavailable
        if: steps.lfs_pull.outcome == 'failure'
        run: |
          set -euo pipefail
          image="ghcr.io/msk-access/krewlyzer:latest"
          echo "::warning::git lfs pull failed. Recovering src/krewlyzer/data from ${image}; the hashes are verified against the LFS pointers in the next step."
          docker pull -q "$image"
          cid=$(docker create "$image")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/usr/local/lib/python3.10/site-packages/krewlyzer/data/." src/krewlyzer/data/

      # Absence is not loud on its own. Measured: with the data removed, pytest
      # reports 27 failed and 986 passed -- but also 68 skipped against a
      # baseline of 38, because conftest marks 30 tests `requires_data`. A skip
      # count does not fail a build. A partial fetch is worse: the paths exist
      # as ~130-byte pointers, so existence checks pass and the failure arrives
      # much later as "Corrupt footer" from inside a reader.
      #
      # Same script, both jobs above: it hashes every tracked file and compares
      # against the oid in its pointer, so it answers "did the pull hydrate?"
      # and "is the image's copy the right data?" with one check.
      - name: Verify the LFS objects
        run: python3 scripts/verify_lfs_objects.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install uv
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev
          pip install uv
      - name: Create and activate uv venv
        run: |
          uv venv .venv
          source .venv/bin/activate
      - name: Install dependencies with uv
        run: |
          source .venv/bin/activate
          uv pip install .[test]
      - name: Run unit tests
        run: |
          source .venv/bin/activate
          uv pip list
          python -m pytest --maxfail=3 --disable-warnings -q
      - name: Build Python Package (Dry Run)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --sdist --manifest-path rust/Cargo.toml -i python3.10
          manylinux: manylinux_2_28
          before-script-linux: |
            # Use system OpenSSL instead of building from source
            export OPENSSL_NO_VENDOR=1

            SUDO=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
              SUDO="sudo"
            fi

            if command -v yum &> /dev/null; then
              $SUDO yum install -y zlib-devel bzip2-devel xz-devel libcurl-devel openssl-devel clang llvm-devel
            elif command -v apt-get &> /dev/null; then
              $SUDO apt-get update && $SUDO apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev clang libclang-dev
            elif command -v apk &> /dev/null; then
              $SUDO apk add zlib-dev bzip2-dev xz-dev curl-dev openssl-dev clang clang-dev
            else
              echo "Unsupported package manager"
              exit 1
            fi
      - name: Verify Wheel
        run: |
          source .venv/bin/activate
          pip install dist/*.whl
          python -c "import krewlyzer; print('Imported:', krewlyzer); print('File:', krewlyzer.__file__)"
          krewlyzer --help
      - name: Build Docker Image (Dry Run)
        run: |
          docker build .

  rust-test:
    name: Rust unit tests (cargo test)
    # Runs on macOS deliberately. krewlyzer_core is a pyo3 `extension-module`
    # cdylib, so it does not link libpython; on Linux the `cargo test` binary
    # therefore fails to resolve Python symbols at link time. macOS resolves
    # them lazily and links fine. Linux compilation of the crate is already
    # covered by the maturin build in the `test` job.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # No LFS. Proven empirically, not assumed: with src/krewlyzer/data
          # renamed away, `cargo test --lib` passes all 112 tests and every lint
          # check is clean. The Rust sources reference the data directory
          # nowhere, and their test fixtures are synthetic names written into
          # tempdirs.
          #
          # It matters because the bundled data is 643 MB across 44 objects and
          # three jobs were each pulling it. On 2026-08-17 the download quota ran
          # out and every job failed at Checkout, before running anything:
          #     error: failed to fetch some objects from '.../info/lfs'
          # Only the `test` job genuinely needs it.
          lfs: false

      # pyo3 builds against whatever interpreter it finds, and the macOS runner
      # ships one newer than pyo3 0.23 supports ("configured Python interpreter
      # version (3.14) is newer than PyO3's maximum supported version (3.13)").
      # Pin to the version the rest of the workflow uses.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: |
          cargo test --manifest-path rust/Cargo.toml --lib

  phi-secret-scan:
    name: PHI / secret scan
    # The git hooks only protect contributors who ran
    # `git config core.hooksPath .githooks`. This job is the backstop.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need the merge base to scope the scan

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Verify the rules still fire before trusting a clean scan. A rule that
      # silently stopped matching would otherwise look identical to success.
      - name: Verify the PHI guard itself
        run: bash scripts/check_phi_guard.sh

      # Scoped to what this branch adds. A full-history scan would flag commits
      # that predate the guard and cannot be changed without a rewrite, which
      # would block every push and train everyone to bypass it.
      - name: Scan the incoming commits
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "scanning ${BASE}..HEAD"
          gitleaks detect --source . --log-opts="${BASE}..HEAD" \
            --no-banner --redact --exit-code 1

      # gitleaks scans diffs, never commit messages -- and a message cannot be
      # edited after a push without rewriting history.
      - name: Scan the commit messages
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          git log "${BASE}..HEAD" --format='%B%n%an %ae' > /tmp/commit-messages.txt
          gitleaks stdin --config .gitleaks.toml \
            --no-banner --redact --exit-code 1 < /tmp/commit-messages.txt

  lint:
    name: Lint (ruff · black · mypy · clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # No LFS. Proven empirically, not assumed: with src/krewlyzer/data
          # renamed away, `cargo test --lib` passes all 112 tests and every lint
          # check is clean. The Rust sources reference the data directory
          # nowhere, and their test fixtures are synthetic names written into
          # tempdirs.
          #
          # It matters because the bundled data is 643 MB across 44 objects and
          # three jobs were each pulling it. On 2026-08-17 the download quota ran
          # out and every job failed at Checkout, before running anything:
          #     error: failed to fetch some objects from '.../info/lfs'
          # Only the `test` job genuinely needs it.
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev \
            zlib1g-dev libbz2-dev liblzma-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python dependencies
        run: |
          # Build the Rust extension first — mypy needs to import krewlyzer._core
          uv pip install --system maturin
          maturin build --release --manifest-path rust/Cargo.toml --out dist
          uv pip install --system dist/*.whl
          # Install lint tools from dev extras
          uv pip install --system ".[dev]"

      - name: Run black
        run: |
          black --check src/krewlyzer/ tests/

      - name: Run ruff
        run: |
          ruff check src/krewlyzer/ tests/

      - name: Run mypy
        run: |
          mypy src/krewlyzer/ --ignore-missing-imports --no-error-summary

      - name: Run cargo clippy
        run: |
          cargo clippy --manifest-path rust/Cargo.toml -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity

      # Static gate: every output-writing call site must pass output_format=
      # and compress=. .agents/rules/development.md already claims CI enforces
      # this, but it was not wired into any workflow.
      - name: Check output-format call sites
        run: |
          python scripts/check_output_format.py
