name: Run Unit Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true  # Required for data files in src/krewlyzer/data/
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install uv
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev
          pip install uv
      - name: Create and activate uv venv
        run: |
          uv venv .venv
          source .venv/bin/activate
      - name: Install dependencies with uv
        run: |
          source .venv/bin/activate
          uv pip install .[test]
      - name: Run unit tests
        run: |
          source .venv/bin/activate
          uv pip list
          python -m pytest --maxfail=3 --disable-warnings -q
      - name: Build Python Package (Dry Run)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --sdist --manifest-path rust/Cargo.toml -i python3.10
          manylinux: manylinux_2_28
          before-script-linux: |
            # Use system OpenSSL instead of building from source
            export OPENSSL_NO_VENDOR=1

            SUDO=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
              SUDO="sudo"
            fi

            if command -v yum &> /dev/null; then
              $SUDO yum install -y zlib-devel bzip2-devel xz-devel libcurl-devel openssl-devel clang llvm-devel
            elif command -v apt-get &> /dev/null; then
              $SUDO apt-get update && $SUDO apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev clang libclang-dev
            elif command -v apk &> /dev/null; then
              $SUDO apk add zlib-dev bzip2-dev xz-dev curl-dev openssl-dev clang clang-dev
            else
              echo "Unsupported package manager"
              exit 1
            fi
      - name: Verify Wheel
        run: |
          source .venv/bin/activate
          pip install dist/*.whl
          python -c "import krewlyzer; print('Imported:', krewlyzer); print('File:', krewlyzer.__file__)"
          krewlyzer --help
      - name: Build Docker Image (Dry Run)
        run: |
          docker build .

  rust-test:
    name: Rust unit tests (cargo test)
    # Runs on macOS deliberately. krewlyzer_core is a pyo3 `extension-module`
    # cdylib, so it does not link libpython; on Linux the `cargo test` binary
    # therefore fails to resolve Python symbols at link time. macOS resolves
    # them lazily and links fine. Linux compilation of the crate is already
    # covered by the maturin build in the `test` job.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true

      # pyo3 builds against whatever interpreter it finds, and the macOS runner
      # ships one newer than pyo3 0.23 supports ("configured Python interpreter
      # version (3.14) is newer than PyO3's maximum supported version (3.13)").
      # Pin to the version the rest of the workflow uses.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: |
          cargo test --manifest-path rust/Cargo.toml --lib

  phi-secret-scan:
    name: PHI / secret scan
    # The git hooks only protect contributors who ran
    # `git config core.hooksPath .githooks`. This job is the backstop.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need the merge base to scope the scan

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Verify the rules still fire before trusting a clean scan. A rule that
      # silently stopped matching would otherwise look identical to success.
      - name: Verify the PHI guard itself
        run: bash scripts/check_phi_guard.sh

      # Scoped to what this branch adds. A full-history scan would flag commits
      # that predate the guard and cannot be changed without a rewrite, which
      # would block every push and train everyone to bypass it.
      - name: Scan the incoming commits
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "scanning ${BASE}..HEAD"
          gitleaks detect --source . --log-opts="${BASE}..HEAD" \
            --no-banner --redact --exit-code 1

      # gitleaks scans diffs, never commit messages -- and a message cannot be
      # edited after a push without rewriting history.
      - name: Scan the commit messages
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          git log "${BASE}..HEAD" --format='%B%n%an %ae' > /tmp/commit-messages.txt
          gitleaks stdin --config .gitleaks.toml \
            --no-banner --redact --exit-code 1 < /tmp/commit-messages.txt

  lint:
    name: Lint (ruff · black · mypy · clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev \
            zlib1g-dev libbz2-dev liblzma-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python dependencies
        run: |
          # Build the Rust extension first — mypy needs to import krewlyzer._core
          uv pip install --system maturin
          maturin build --release --manifest-path rust/Cargo.toml --out dist
          uv pip install --system dist/*.whl
          # Install lint tools from dev extras
          uv pip install --system ".[dev]"

      - name: Run black
        run: |
          black --check src/krewlyzer/ tests/

      - name: Run ruff
        run: |
          ruff check src/krewlyzer/ tests/

      - name: Run mypy
        run: |
          mypy src/krewlyzer/ --ignore-missing-imports --no-error-summary

      - name: Run cargo clippy
        run: |
          cargo clippy --manifest-path rust/Cargo.toml -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity

      # Static gate: every output-writing call site must pass output_format=
      # and compress=. .agent/rules/development.md already claims CI enforces
      # this, but it was not wired into any workflow.
      - name: Check output-format call sites
        run: |
          python scripts/check_output_format.py
