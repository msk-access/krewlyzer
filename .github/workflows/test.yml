name: Run Unit Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Never LFS here. Tier 1 gets the bundled data from the pinned
          # release image instead -- see .github/data-image.txt for why, and
          # the change-detection step below for when it is allowed to.
          lfs: false

      # Tier 1 may only use the image when this change does not touch the
      # assets, because the image carries release-time data. When it does touch
      # them, the image is stale by definition and the `full-assets` workflow
      # takes over with a real LFS pull.
      #
      # The generator scripts and the asset tests are in the filter too, not
      # just the data. A change to scripts/build_gene_bed.py without a
      # regeneration puts the asset and its builder out of step; a weakened
      # assertion in the asset tests would, under a data-only filter, never run
      # to reveal itself.
      #
      # Asks the API rather than diffing, so the checkout stays shallow --
      # `.git/objects` is 191 MB and fetch-depth: 0 would pay that every run.
      - name: Does this change touch the bundled assets?
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              files=$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --jq '.[].filename') ;;
            push)
              before="${{ github.event.before }}"
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                files=""   # new branch, no diff base
              else
                files=$(gh api \
                  "repos/${{ github.repository }}/compare/${before}...${{ github.sha }}" \
                  --jq '.files[].filename') ;
              fi ;;
            *) files="" ;;   # workflow_dispatch: no diff context
          esac
          # No diff context falls through to "unchanged" deliberately. The
          # image is still hash-verified, so the worst case is a loud failure,
          # not silently testing the wrong bytes.
          if printf '%s\n' "$files" | grep -qE '^(src/krewlyzer/data/|scripts/build_|tests/unit/test_gene_bed_assets\.py|tests/integration/test_region_entropy\.py)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This change touches the bundled assets, so tier 1 skips them entirely. The full-assets workflow checks them against real LFS."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the bundled data from the pinned release image
        if: steps.assets.outputs.changed == 'false'
        run: |
          set -euo pipefail
          digest=$(grep -v '^#' .github/data-image.txt | tr -d '[:space:]')
          [ -n "$digest" ] || { echo "::error::.github/data-image.txt has no digest"; exit 1; }
          image="ghcr.io/msk-access/krewlyzer@${digest}"
          if ! docker pull -q "$image"; then
            echo "::error::Could not pull ${image}. If this is a fork, or the \
          package was retagged, the pin in .github/data-image.txt needs updating."
            exit 1
          fi
          cid=$(docker create "$image")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          # Path is fixed by Dockerfile:53. If that COPY ever moves or is
          # dropped, this fails here rather than testing an empty directory.
          docker cp "${cid}:/usr/local/lib/python3.10/site-packages/krewlyzer/data/." \
                    src/krewlyzer/data/

      # Proves the extracted bytes are the ones git recorded, by hashing each
      # tracked file against the oid in its LFS pointer. This is what makes the
      # image a transport rather than a second source of truth.
      - name: Verify the bundled data against the LFS pointers
        if: steps.assets.outputs.changed == 'false'
        run: python3 scripts/verify_lfs_objects.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install uv
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev
          pip install uv
      - name: Create and activate uv venv
        run: |
          uv venv .venv
          source .venv/bin/activate
      - name: Install dependencies with uv
        run: |
          source .venv/bin/activate
          uv pip install .[test]
      - name: Run unit tests
        env:
          # Set only when the assets were fetched and verified above. Unset,
          # the asset-integrity tests skip; set, they run and *fail* if the
          # files are not really there. See conftest.requires_full_assets --
          # the marker keys on being asked for the assets, not on their
          # happening to be present, so this cannot go quietly green.
          KREWLYZER_FULL_ASSETS: ${{ steps.assets.outputs.changed == 'false' && '1' || '' }}
        run: |
          source .venv/bin/activate
          uv pip list
          python -m pytest --maxfail=3 --disable-warnings -q
      - name: Build Python Package (Dry Run)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --sdist --manifest-path rust/Cargo.toml -i python3.10
          manylinux: manylinux_2_28
          before-script-linux: |
            # Use system OpenSSL instead of building from source
            export OPENSSL_NO_VENDOR=1

            SUDO=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
              SUDO="sudo"
            fi

            if command -v yum &> /dev/null; then
              $SUDO yum install -y zlib-devel bzip2-devel xz-devel libcurl-devel openssl-devel clang llvm-devel
            elif command -v apt-get &> /dev/null; then
              $SUDO apt-get update && $SUDO apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev clang libclang-dev
            elif command -v apk &> /dev/null; then
              $SUDO apk add zlib-dev bzip2-dev xz-dev curl-dev openssl-dev clang clang-dev
            else
              echo "Unsupported package manager"
              exit 1
            fi
      - name: Verify Wheel
        run: |
          source .venv/bin/activate
          pip install dist/*.whl
          python -c "import krewlyzer; print('Imported:', krewlyzer); print('File:', krewlyzer.__file__)"
          krewlyzer --help
      - name: Build Docker Image (Dry Run)
        run: |
          docker build .

  rust-test:
    name: Rust unit tests (cargo test)
    # Runs on macOS deliberately. krewlyzer_core is a pyo3 `extension-module`
    # cdylib, so it does not link libpython; on Linux the `cargo test` binary
    # therefore fails to resolve Python symbols at link time. macOS resolves
    # them lazily and links fine. Linux compilation of the crate is already
    # covered by the maturin build in the `test` job.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # No LFS. Proven empirically, not assumed: with src/krewlyzer/data
          # renamed away, `cargo test --lib` passes all 112 tests and every lint
          # check is clean. The Rust sources reference the data directory
          # nowhere, and their test fixtures are synthetic names written into
          # tempdirs.
          #
          # It matters because the bundled data is 643 MB across 44 objects and
          # three jobs were each pulling it. On 2026-08-17 the download quota ran
          # out and every job failed at Checkout, before running anything:
          #     error: failed to fetch some objects from '.../info/lfs'
          # Only the `test` job genuinely needs it.
          lfs: false

      # pyo3 builds against whatever interpreter it finds, and the macOS runner
      # ships one newer than pyo3 0.23 supports ("configured Python interpreter
      # version (3.14) is newer than PyO3's maximum supported version (3.13)").
      # Pin to the version the rest of the workflow uses.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: |
          cargo test --manifest-path rust/Cargo.toml --lib

  phi-secret-scan:
    name: PHI / secret scan
    # The git hooks only protect contributors who ran
    # `git config core.hooksPath .githooks`. This job is the backstop.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need the merge base to scope the scan

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Verify the rules still fire before trusting a clean scan. A rule that
      # silently stopped matching would otherwise look identical to success.
      - name: Verify the PHI guard itself
        run: bash scripts/check_phi_guard.sh

      # Scoped to what this branch adds. A full-history scan would flag commits
      # that predate the guard and cannot be changed without a rewrite, which
      # would block every push and train everyone to bypass it.
      - name: Scan the incoming commits
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "scanning ${BASE}..HEAD"
          gitleaks detect --source . --log-opts="${BASE}..HEAD" \
            --no-banner --redact --exit-code 1

      # gitleaks scans diffs, never commit messages -- and a message cannot be
      # edited after a push without rewriting history.
      - name: Scan the commit messages
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          git log "${BASE}..HEAD" --format='%B%n%an %ae' > /tmp/commit-messages.txt
          gitleaks stdin --config .gitleaks.toml \
            --no-banner --redact --exit-code 1 < /tmp/commit-messages.txt

  lint:
    name: Lint (ruff · black · mypy · clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # No LFS. Proven empirically, not assumed: with src/krewlyzer/data
          # renamed away, `cargo test --lib` passes all 112 tests and every lint
          # check is clean. The Rust sources reference the data directory
          # nowhere, and their test fixtures are synthetic names written into
          # tempdirs.
          #
          # It matters because the bundled data is 643 MB across 44 objects and
          # three jobs were each pulling it. On 2026-08-17 the download quota ran
          # out and every job failed at Checkout, before running anything:
          #     error: failed to fetch some objects from '.../info/lfs'
          # Only the `test` job genuinely needs it.
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev \
            zlib1g-dev libbz2-dev liblzma-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python dependencies
        run: |
          # Build the Rust extension first — mypy needs to import krewlyzer._core
          uv pip install --system maturin
          maturin build --release --manifest-path rust/Cargo.toml --out dist
          uv pip install --system dist/*.whl
          # Install lint tools from dev extras
          uv pip install --system ".[dev]"

      - name: Run black
        run: |
          black --check src/krewlyzer/ tests/

      - name: Run ruff
        run: |
          ruff check src/krewlyzer/ tests/

      - name: Run mypy
        run: |
          mypy src/krewlyzer/ --ignore-missing-imports --no-error-summary

      - name: Run cargo clippy
        run: |
          cargo clippy --manifest-path rust/Cargo.toml -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity

      # Static gate: every output-writing call site must pass output_format=
      # and compress=. .agents/rules/development.md already claims CI enforces
      # this, but it was not wired into any workflow.
      - name: Check output-format call sites
        run: |
          python scripts/check_output_format.py
