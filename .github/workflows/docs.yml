name: Docs

# Deliberately a separate workflow. `test.yml` carries
# `paths-ignore: docs/**, *.md`, so it never runs for a documentation-only
# change -- which is precisely when this check is needed. Putting the check
# there would have made it look enforced while never firing on the PRs that
# matter.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'krewlyzer_all_docs.md'
      - 'scripts/build_all_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'krewlyzer_all_docs.md'
      - 'scripts/build_all_docs.py'
  workflow_dispatch:

jobs:
  aggregate:
    name: Aggregated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # No dependencies: build_all_docs.py is stdlib-only so this stays a
      # seconds-long job rather than another full environment build.
      - name: Check krewlyzer_all_docs.md matches docs/
        run: python scripts/build_all_docs.py --check
